name: verify
on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
      - reopened
      - ready_for_review
env: {}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: verify (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.7.0
          run_install: false
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Run make
        run: make
      - name: Run verify
        run: make verify
  changelog:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Changelog updated
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelog updated
        run: |
          git fetch origin main --depth=1
          src_changed=$(git diff --name-only FETCH_HEAD HEAD -- src/)
          changelog_changed=$(git diff --name-only FETCH_HEAD HEAD -- CHANGELOG.md)
          if [ -n "$src_changed" ] && [ -z "$changelog_changed" ]; then
            echo "Error: src/ has changed but CHANGELOG.md has not been updated."
            exit 1
          fi
